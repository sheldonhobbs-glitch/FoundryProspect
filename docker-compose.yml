services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
      POSTGRES_DB: ember
    ports:
      - "5432:5432"
    volumes:
      - ember_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ember:ember@db:5432/ember
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ember:ember@db:5432/ember
    depends_on:
      db:
        condition: service_healthy
    command: python -m worker.main

volumes:
  ember_pgdata:
