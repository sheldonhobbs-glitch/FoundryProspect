<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ember</title>
  <meta name="theme-color" content="#e8734a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Logged-out screen: there's no login form. Ember's login IS a
         bookmarked link (/login/<token>) — visiting it sets the session
         and lands here already authenticated. -->
    <section id="login-screen" class="screen">
      <div class="login-card">
        <h1>🔥 Ember</h1>
        <p class="subtitle">Your household, sorted.</p>
        <p class="login-instructions">
          Not logged in. Open your bookmarked Ember link to get in —
          there's no username or password to type.
        </p>
      </div>
    </section>

    <!-- Chat-style main screen -->
    <section id="chat-screen" class="screen" hidden>
      <header class="chat-header">
        <span class="brand">🔥 Ember</span>
        <button id="logout-btn" class="link-btn">Log out</button>
      </header>

      <main id="chat-log" class="chat-log"></main>

      <footer class="chat-input-bar">
        <input id="chat-input" type="text" placeholder="Ember is listening... (chat features arrive in later phases)" disabled />
      </footer>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
