<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ember</title>
  <meta name="theme-color" content="#C98A3E" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Logged-out screen: there's no login form. Ember's login IS a
         bookmarked link (/login/<token>) — visiting it sets the session
         and lands here already authenticated. -->
    <section id="login-screen" class="screen">
      <div class="login-card">
        <h1>🔥 Ember</h1>
        <p class="subtitle">Your household, sorted.</p>
        <p class="login-instructions">
          Not logged in. Open your bookmarked Ember link to get in —
          there's no username or password to type.
        </p>
      </div>
    </section>

    <!-- Identity screen: not a login, just "who's using the app right now"
         so Decisions/Calendar can attribute things to a person. Shown once
         per session after the real (shared) login above. -->
    <section id="identity-screen" class="screen" hidden>
      <div class="login-card">
        <h1>🔥 Ember</h1>
        <p class="subtitle">Who's this?</p>
        <div class="identity-options">
          <button type="button" class="identity-option" data-name="sheldon">
            <span class="identity-avatar sheldon">S</span>
            <span>Sheldon</span>
          </button>
          <button type="button" class="identity-option" data-name="partner">
            <span class="identity-avatar partner">P</span>
            <span>Partner</span>
          </button>
        </div>
        <p class="login-instructions">Just for attributing votes and calendar entries — not a separate login.</p>
      </div>
    </section>

    <!-- Main screen: home is a curated "what needs you today" digest.
         Browse is the full section-tile grid for looking at everything in
         a category, not just what's due. Detail is one section at a time,
         opened from Browse and closed back to it. -->
    <section id="main-screen" class="screen" hidden>
      <header class="app-header">
        <button type="button" id="brand-btn" class="brand-btn">🔥 Ember</button>
        <div class="header-actions">
          <button type="button" id="identity-btn" class="identity-pill">
            <span class="identity-avatar" id="identity-avatar"></span>
            <span id="identity-label"></span>
          </button>
          <button type="button" id="browse-btn" class="link-btn">Browse</button>
          <button type="button" id="logout-btn" class="link-btn">Log out</button>
        </div>
      </header>

      <main id="content-area">
        <div id="home-view">
          <div class="digest-header">
            <div class="digest-date" id="digest-date"></div>
            <h1 id="digest-greeting"></h1>
            <p class="digest-sub" id="digest-sub"></p>
          </div>

          <div id="status-bubble" class="bubble system" hidden></div>
          <div id="notifications-list"></div>
          <div id="digest-feed"></div>
        </div>

        <div id="browse-view" hidden>
          <h2 class="browse-title">Browse</h2>
          <div id="section-grid">
            <button type="button" class="section-tile" data-resource="household">
              <span class="tile-label">Household</span>
              <span class="tile-count" data-count-for="household"></span>
            </button>
            <button type="button" class="section-tile" data-resource="calendar">
              <span class="tile-label">Calendar</span>
              <span class="tile-count" data-count-for="calendar"></span>
            </button>
            <button type="button" class="section-tile" data-resource="decisions">
              <span class="tile-label">Decisions</span>
              <span class="tile-count" data-count-for="decisions"></span>
            </button>
            <button type="button" class="section-tile" data-resource="financial">
              <span class="tile-label">Financial</span>
              <span class="tile-count" data-count-for="financial"></span>
            </button>
            <button type="button" class="section-tile" data-resource="meals">
              <span class="tile-label">Meal planning</span>
              <span class="tile-count" data-count-for="meals"></span>
            </button>
          </div>
        </div>

        <div id="detail-view" hidden>
          <button type="button" id="back-btn">← Browse</button>
          <h2 id="detail-title"></h2>
          <div id="detail-body"></div>
        </div>
      </main>

      <div class="composer" id="composer-bar">
        <!-- Ember's replies: a transient panel above the composer, not a chat app. -->
        <div class="ember-panel" id="ember-panel" hidden>
          <div class="ember-panel-head">
            <span class="ember-panel-title">Ember</span>
            <button type="button" class="ember-panel-close" id="ember-panel-close" aria-label="Close">×</button>
          </div>
          <div class="ember-thread" id="ember-thread" aria-live="polite"></div>
        </div>
        <form class="composer-inner" id="composer-form" autocomplete="off">
          <input type="text" id="composer-input" maxlength="2000"
                 placeholder="Tell Ember what happened, or ask anything…" aria-label="Message Ember" />
          <button type="submit" id="composer-send" class="send-btn" aria-label="Send">↑</button>
        </form>
      </div>

      <div class="toast" id="toast"></div>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/household.js"></script>
  <script src="/static/js/ember.js"></script>
</body>
</html>
