<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ember</title>
  <meta name="theme-color" content="#C98A3E" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Logged-out screen: there's no login form. Ember's login IS a
         bookmarked link (/login/<token>) — visiting it sets the session
         and lands here already authenticated. -->
    <section id="login-screen" class="screen">
      <div class="login-card">
        <h1>🔥 Ember</h1>
        <p class="subtitle">Your household, sorted.</p>
        <p class="login-instructions">
          Not logged in. Open your bookmarked Ember link to get in —
          there's no username or password to type.
        </p>
      </div>
    </section>

    <!-- Main screen: home is a curated "what needs you today" digest.
         Browse is the full section-tile grid for looking at everything in
         a category, not just what's due. Detail is one section at a time,
         opened from Browse and closed back to it. -->
    <section id="main-screen" class="screen" hidden>
      <header class="app-header">
        <button type="button" id="brand-btn" class="brand-btn">🔥 Ember</button>
        <div class="header-actions">
          <button type="button" id="browse-btn" class="link-btn">Browse</button>
          <button type="button" id="logout-btn" class="link-btn">Log out</button>
        </div>
      </header>

      <main id="content-area">
        <div id="home-view">
          <div class="digest-header">
            <div class="digest-date" id="digest-date"></div>
            <h1 id="digest-greeting"></h1>
            <p class="digest-sub" id="digest-sub"></p>
          </div>

          <div id="status-bubble" class="bubble system" hidden></div>
          <div id="notifications-list"></div>
          <div id="digest-feed"></div>
        </div>

        <div id="browse-view" hidden>
          <h2 class="browse-title">Browse</h2>
          <div id="section-grid">
            <button type="button" class="section-tile" data-resource="bills">
              <span class="tile-label">Bills</span>
              <span class="tile-count" data-count-for="bills"></span>
            </button>
            <button type="button" class="section-tile" data-resource="subscriptions">
              <span class="tile-label">Subscriptions</span>
              <span class="tile-count" data-count-for="subscriptions"></span>
            </button>
            <button type="button" class="section-tile" data-resource="maintenance">
              <span class="tile-label">Maintenance</span>
              <span class="tile-count" data-count-for="maintenance"></span>
            </button>
            <button type="button" class="section-tile" data-resource="warranties">
              <span class="tile-label">Warranties</span>
              <span class="tile-count" data-count-for="warranties"></span>
            </button>
            <button type="button" class="section-tile" data-resource="calendar">
              <span class="tile-label">Calendar</span>
              <span class="tile-count" data-count-for="calendar"></span>
            </button>
            <button type="button" class="section-tile" data-resource="decisions">
              <span class="tile-label">Decisions</span>
              <span class="tile-count" data-count-for="decisions"></span>
            </button>
          </div>
        </div>

        <div id="detail-view" hidden>
          <button type="button" id="back-btn">← Browse</button>
          <h2 id="detail-title"></h2>
          <div id="detail-body"></div>
        </div>
      </main>

      <div class="composer" id="composer-bar">
        <div class="composer-inner">
          <input type="text" id="composer-input" placeholder="Add a reminder, item, or note…" />
          <button type="button" id="composer-send" class="send-btn">↑</button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/household.js"></script>
</body>
</html>
